[package]
name = "patch-applier"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Atomic V4A patch applier for Agenty"

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.12"
similar = "2"

[profile.release]
lto = true
strip = true
