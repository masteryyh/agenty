[package]
name = "agenty-bootstrap"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Self-extracting launcher for agenty: verifies, extracts and starts the bundled CLI and core"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.12"
dirs = "6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }


[profile.release]
lto = true
strip = true
