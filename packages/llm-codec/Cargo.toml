[package]
name = "llm-codec"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Local tokenizer and chat template C ABI for Agenty"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
minijinja = { version = "2.24", default-features = false, features = ["builtins", "debug", "macros", "multi_template", "loop_controls", "fuel", "preserve_order", "serde", "std_collections", "adjacent_loop_items"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile = "3"
ahash = "0.8"

[profile.release]
lto = true
panic = "unwind"
