language = "C"
include_guard = "LLM_CODEC_H"
autogen_warning = "/* Generated by cbindgen. Do not edit. */"
usize_is_size_t = true
documentation = true
cpp_compat = true

[export]
include = ["LlmCodecHandle", "LlmCodecBytes", "LlmCodecTokens", "LlmCodecError", "ErrorCode"]
exclude = ["Model", "LoadOptions", "ModelMetadata", "SpecialToken", "TemplateInfo", "RenderRequest", "RenderMessage", "ToolCall", "FunctionCall", "Error", "Result", "ABI_VERSION", "MAX_INPUT_BYTES"]

[export.rename]
ErrorCode = "LlmCodecErrorCode"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
